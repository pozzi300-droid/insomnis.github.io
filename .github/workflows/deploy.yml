name: Build and Deploy

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

concurrency:
  group: 'deploy-production'
  cancel-in-progress: true

jobs:
  deploy-sftp:
    name: Deploy to SFTP Server (e2.aurorix.net)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build site
        env:
          BASE_PATH: '/'
        run: npm run build

      - name: Deploy files via SFTP to server root
        env:
          SFTP_HOST: "e2.aurorix.net"
          SFTP_PORT: "2022"
          SFTP_USER: "mnvxzzz.e0a1a5f4"
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD || 'exe.Discord' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$SFTP_USER,$SFTP_PASS" -p "$SFTP_PORT" "sftp://$SFTP_HOST" << 'EOF'
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          set ssl:verify-certificate no
          set net:timeout 45
          set net:max-retries 3
          mirror -R --delete --verbose ./dist/ /
          quit
          EOF
